# Nginx config for Backend (API)
# Domain: api-selora.mooo.com

server {
    listen 80;
    listen [::]:80;
    server_name api-selora.mooo.com;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE (POST /api/chat/stream). nginx buffers proxied responses by default,
    # which holds every chunk until the response ends — i.e. it silently
    # un-streams the stream and the user waits exactly as long as before, then
    # gets the whole answer at once. The app also sends X-Accel-Buffering: no,
    # which nginx honours; this block is the belt to that suspenders, and adds
    # the longer read timeout a slow generation needs.
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # SSL configuration will be added by certbot automatically
}
