# Nginx config for Frontend
# Domain: astro-ai.mooo.com

server {
    listen 80;
    listen [::]:80;
    server_name astro-ai.mooo.com;
    
    # Built SPA lives here
    root /home/ubuntu/astrology-ai-pro/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSL configuration will be added by certbot automatically
}
