# Nginx config for Frontend
# Domain: selora.mooo.com

server {
    listen 80;
    listen [::]:80;
    server_name selora.mooo.com;

    # Built SPA lives here
    root /home/ubuntu/astrology-ai-pro/frontend/dist;
    index index.html;

    # Security headers (migrated from the old frontend/vercel.json — the VPS is
    # now the only deploy target). `always` sends them on error responses too.
    # NOTE: nginx does NOT inherit these into a location that sets its own
    # add_header (e.g. /assets/ below); that's fine — these protect the HTML doc.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # HSTS — only meaningful once served over HTTPS (certbot adds the 443 block).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSL configuration will be added by certbot automatically
}
