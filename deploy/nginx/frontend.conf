# Nginx config for Frontend
# Domain: astro-ai.mooo.com

server {
    listen 80;
    listen [::]:80;
    server_name astro-ai.mooo.com;
    
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astro-ai.mooo.com;

    ssl_certificate     /etc/letsencrypt/live/astro-ai.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astro-ai.mooo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # Built SPA lives here
    root /home/ubuntu/astrology-ai-pro/frontend/dist;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
