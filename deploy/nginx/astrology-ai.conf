# Nginx site config for the Astrology AI web app on the Oracle VPS.
#
# Replaces what Vercel did for us:
#   • serves the built React SPA (frontend/dist) with client-side-routing fallback
#   • re-applies the security HTTP headers that lived in frontend/vercel.json
#   • reverse-proxies /api to the backend (pm2, port 5000) so the browser talks
#     to ONE origin → connect-src 'self' covers the API and CORS is a non-issue
#
# NOTE: the FULL Content-Security-Policy (script-src / connect-src / etc.) is
# injected as a build-time <meta> tag inside index.html (see frontend/vite.config.js),
# so it keeps working when served as a static file here. The header below only
# re-adds `frame-ancestors`, which a <meta> tag cannot set.
#
# Install:
#   sudo cp deploy/nginx/astrology-ai.conf /etc/nginx/sites-available/astrology-ai
#   sudo ln -s /etc/nginx/sites-available/astrology-ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS: run `sudo certbot --nginx -d yourdomain.com` — certbot rewrites the
# listen/ssl_* lines below automatically.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;   # ← change to your domain

    # Let certbot serve the ACME challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;   # ← change to your domain

    # certbot fills these in; placeholders until then.
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Built SPA lives here (matches FRONTEND_DEPLOY_PATH the CI SCPs to).
    root /var/www/astrology-ai;     # ← match FRONTEND_DEPLOY_PATH
    index index.html;

    # ── Security headers (ported verbatim from frontend/vercel.json) ──────────
    # `always` so they're sent on error responses too. HSTS is 2 years + preload.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # ── API reverse proxy → backend (pm2 on 5000) ─────────────────────────────
    # Lets the frontend use VITE_API_URL=https://yourdomain.com/api (same-origin).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;   # backend env PORT default
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;            # Gemini calls can be slow
    }

    # ── Static assets: long-cache the content-hashed bundles ──────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients get stuck on old builds.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA fallback: every non-file route serves index.html (React Router) ───
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
