function navamsaSign(lon){
  const totalMin=nm(lon)*60;
  const navIdx=Math.floor(totalMin/200); // 3°20' = 200 min
  const startSigns=[0,8,4,0,8,4,0,8,4,0,8,4]; // Aries, Sagittarius, Leo repeating
  const rIdx=Math.floor(nm(lon)/30);
  return SIGNS[(startSigns[rIdx]+navIdx)%12];

const DASHA_LEN = {Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
const DASHA_ORDER = ["Ketu","Venus","Sun","Moon","Mars","Rahu","Jupiter","Saturn","Mercury"];

function computeDasha(moonLon,birthDate){
  const nakIdx=Math.floor(moonLon/(13+1/3));
  const rem=nm(moonLon)%(13+1/3);
  const startLord=DASHA_ORDER[(nakIdx+0)%9]; // starts from Ashwini(Ketu)
  const elapsed=rem/(13+1/3);
  const totalYrs=DASHA_LEN[startLord];
  const remYrs=totalYrs*(1-elapsed);
  let curDate=new Date(birthDate.getTime() - (totalYrs-remYrs)*YEAR_MS);
  const periods=[];
  let startIdx=DASHA_ORDER.indexOf(startLord);
  for(let i=0;i<18;i++){
    const lord=DASHA_ORDER[(startIdx+i)%9];
    const yrs=DASHA_LEN[lord];
    const end=new Date(curDate.getTime()+yrs*YEAR_MS);
    const m={lord,start:new Date(curDate),end:new Date(end)};
    // add antardashas (sub-periods)
    m.sub=[];
    let subStart=new Date(curDate);
    for(let j=0;j<9;j++){
      const sLord=DASHA_ORDER[(DASHA_ORDER.indexOf(lord)+j)%9];
      const sYrs=yrs*(DASHA_LEN[sLord]/120);
      const sEnd=new Date(subStart.getTime()+sYrs*YEAR_MS);
      m.sub.push({lord:sLord,start:new Date(subStart),end:new Date(sEnd)});
      subStart=new Date(sEnd);
    }
    periods.push(m);
    curDate=new Date(end);
  }
  return periods;
}

function computeScores(ch){
  const P={}; ch.planets.forEach(p=>{P[p.base]=p});
  const benefics=["Jupiter","Venus","Moon","Mercury"], malefic=["Saturn","Mars","Rahu","Ketu","Sun"];

      });

function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function computeHouseLords(ch){
  const ascSign=Math.floor(nm(ch.angles.ascSid)/30);
  const find=b=>ch.planets.find(p=>p.base===b);
  const lords=[];
  for(let h=1;h<=12;h++){
    const sign=SIGNS[(ascSign+h-1)%12];
    const lord=SIGN_LORD[sign];
    const lp=find(lord);
    lords.push({house:h,sign,lord,inHouse:lp?lp.houseSid:null,inSign:lp?signOf(lp.sid):null});
  }
  // dispositor of each planet = lord of the sign it occupies
  ch.planets.forEach(p=>{p.dispositor=SIGN_LORD[signOf(p.sid)]});
  // dispositor chain for each graha until it loops (own sign = self-dispositor root)
  const find2=b=>ch.planets.find(p=>p.base===b);
  ch.planets.filter(p=>SIGN_LORD[signOf(p.sid)]).forEach(p=>{
    const chain=[p.base]; let cur=p, guard=0;
    while(guard++<12){
      const disp=cur.dispositor;
      if(disp===cur.base) break;            // planet in own sign — root
      if(chain.includes(disp)){chain.push(disp+" ↺");break;}
      chain.push(disp);
      cur=find2(disp);
      if(!cur) break;
    }
    p.dispoChain=chain;
  });
  return lords;
}

/* ── MARRIAGE ENGINE — Upapada Lagna, Darakaraka, D9 7th-lord strength ── */
function arudhaPada(houseIdx,lordSignIdx){
  const d=((lordSignIdx-houseIdx+12)%12);    // signs from house to its lord
  let ar=(lordSignIdx+d)%12;                 // same distance again from the lord
  if(ar===houseIdx || ((ar-houseIdx+12)%12)===6) ar=(ar+9)%12; // exception → 10th from it
  return ar;
}
function computeMarriage(ch){
  const ascSign=Math.floor(nm(ch.angles.ascSid)/30);
  const find=b=>ch.planets.find(p=>p.base===b);

  const ulIdx=l12p?arudhaPada(h12,Math.floor(nm(l12p.sid)/30)):h12;

  // Darakaraka aspects (D1 + D9)

  const dkAspects=ch.aspects.filter(a=>a.a===dk||a.b===dk).map(a=>`${a.a} ${a.type} ${a.b} (natal)`)
    .concat(ch.d9.aspects.filter(a=>a.a===dk||a.b===dk).map(a=>`${a.a} ${a.type} ${a.b} (D9)`));
  const ven=find("Venus"), jup=find("Jupiter");
  const d9LordP=find(ch.d9.d9SeventhLord);
  const h7=(ascSign+6)%12, l7p=find(SIGN_LORD[SIGNS[h7]]);
  return {
    upapada, upapadaLord:SIGN_LORD[upapada],
    darakaraka:dk, dkAspects,
    venus:{sign:signOf(ven.sid),dignity:ven.dignity||"neutral",house:ven.houseSid,strength:ven.strength},
    jupiter:{sign:signOf(jup.sid),dignity:jup.dignity||"neutral",house:jup.houseSid,strength:jup.strength},
    d9SeventhLord:ch.d9.d9SeventhLord,
    d9SeventhLordStrength:d9LordP?d9LordP.strength:null,
    d1SeventhLord:SIGN_LORD[SIGNS[h7]],
    d1SeventhLordHouse:l7p?l7p.houseSid:null,
  };
}

function nm(x){return((x%360)+360)%360}

// Build a UTC Date from local birth date/time + timezone offset
function buildDate(dateStr,timeStr,tz){
  const [y,m,d]=dateStr.split("-").map(Number);
  let hh=12,mm=0;
  if(timeStr){const t=timeStr.split(":");hh=+t[0];mm=+t[1];}
  return new Date(Date.UTC(y,m-1,d,hh,mm) - tz*3600*1000);
}

// Mean obliquity of the ecliptic (degrees), d = days from J2000
function obliquity(d){
  const T=d/36525;
  return 23.4392911 - 0.0130041667*T - 1.638889e-7*T*T + 5.036111e-7*T*T*T;
}

// Lahiri ayanamsha (degrees) — tropical→sidereal offset
function ayanamsha(d){
  return 23.8526 + (d/365.25)*0.013969;
}

function signOf(lon){return SIGNS[Math.floor(nm(lon)/30)]}
function dms(lon){
  const x=nm(lon)%30, deg=Math.floor(x), min=Math.floor((x-deg)*60);
  return deg+"°"+String(min).padStart(2,"0")+"'";
}

// Geocentric apparent ecliptic-of-date longitude of a body (tropical)
function bodyLon(body,time){
  const vec=Astronomy.GeoVector(body,time,true);
  const rot=Astronomy.Rotation_EQJ_ECT(time);
  const sph=Astronomy.SphereFromVector(Astronomy.RotateVector(rot,vec));
  return nm(sph.lon);
}

function computeChart(dateStr,timeStr,city){
  if(typeof Astronomy==="undefined")
    throw new Error("Astronomy engine failed to load (check your internet connection).");

  const date=buildDate(dateStr,timeStr,city.tz);
  const time=Astronomy.MakeTime(date);
  const d=time.ut;                    // days from J2000
  const ay=ayanamsha(d);
  const eps=obliquity(d)*D2R;

  const B=Astronomy.Body;
  const bodies=[
    ["Sun",B.Sun],["Moon",B.Moon],["Mercury",B.Mercury],["Venus",B.Venus],
    ["Mars",B.Mars],["Jupiter",B.Jupiter],["Saturn",B.Saturn],
    ["Uranus",B.Uranus],["Neptune",B.Neptune],["Pluto",B.Pluto],
  ];

  const planets=bodies.map(([name,b])=>{
    const lon=bodyLon(b,time);
    // retrograde test (skip luminaries)
    let retro=false;
    if(name!=="Sun"&&name!=="Moon"){
      const prev=bodyLon(b,Astronomy.MakeTime(new Date(date.getTime()-86400000)));
      let dl=lon-prev; if(dl>180)dl-=360; if(dl<-180)dl+=360;
      retro=dl<0;
    }
    return {name,trop:lon,sid:nm(lon-ay),retro};
  });

  // Lunar nodes (mean) — Rahu / Ketu, always retrograde
  const rahu=nm(125.04452 - 0.0529537951*d);
  planets.push({name:"Rahu (N.Node)",trop:rahu,sid:nm(rahu-ay),retro:true});
  planets.push({name:"Ketu (S.Node)",trop:nm(rahu+180),sid:nm(rahu+180-ay),retro:true});

  // Ascendant + Midheaven
  const gast=Astronomy.SiderealTime(time);            // Greenwich apparent sidereal time (hours)
  const ramc=nm((gast + city.lon/15)*15)*D2R;         // right ascension of meridian
  const latR=city.lat*D2R;
  let mc=nm(Math.atan2(Math.sin(ramc),Math.cos(ramc)*Math.cos(eps))*R2D);
  let asc=nm(Math.atan2(Math.cos(ramc),
            -(Math.sin(ramc)*Math.cos(eps)+Math.tan(latR)*Math.sin(eps)))*R2D);
  if(nm(asc-mc)>180) asc=nm(asc+180);
  const angles={ascTrop:asc, ascSid:nm(asc-ay), mcTrop:mc, mcSid:nm(mc-ay)};

  // Whole-sign houses for each planet, per system
  const ascSignS=Math.floor(angles.ascSid/30), ascSignT=Math.floor(angles.ascTrop/30);
  planets.forEach(p=>{
    p.houseSid=((Math.floor(p.sid/30)-ascSignS+12)%12)+1;
    p.houseTrop=((Math.floor(p.trop/30)-ascSignT+12)%12)+1;
    // ── deterministic rule lookup → base meaning for this placement ──
    p.base=p.name.split(" ")[0];                       // "Rahu (N.Node)" -> "Rahu"
    const sign=signOf(p.sid);
    p.dignity=dignityOf(p.base,sign);
    p.nav=navamsaSign(p.sid);                           // D9 navamsa sign
    p.angular=[1,4,7,10].includes(p.houseSid);          // angular = stronger
    p.rule=`${p.name} (${PLANET_DOMAIN[p.base]||"—"}) in ${sign} `+
           `[${SIGN_QUALITY[sign]}], House ${p.houseSid} `+
           `[${HOUSE_AREA[p.houseSid]}]`+
           (p.dignity?` — ${p.dignity}`:"")+
           (p.angular?" — ANGULAR (emphasised)":"")+
           (p.retro?" — retrograde (internalised energy)":"");
  });

  // Moon nakshatra (sidereal)
  const moon=planets[1];
  const nakIdx=Math.floor(moon.sid/(13+1/3));
  const nakshatra=NAKSHATRAS[nakIdx];

  // Western aspects (angle-based; identical in both zodiacs)
  const ASPECTS=[["Conjunction",0,8],["Sextile",60,4],["Square",90,6],["Trine",120,6],["Opposition",180,8]];
  const aspBodies=planets.filter(p=>!p.name.startsWith("Rahu")&&!p.name.startsWith("Ketu"));
  const aspects=[];
  for(let i=0;i<aspBodies.length;i++)for(let j=i+1;j<aspBodies.length;j++){
    let sep=Math.abs(aspBodies[i].trop-aspBodies[j].trop)%360;
    if(sep>180)sep=360-sep;
    for(const [an,ang,orb] of ASPECTS){
      if(Math.abs(sep-ang)<=orb){
        const A=aspBodies[i].name,Bn=aspBodies[j].name,o=Math.abs(sep-ang);
        aspects.push({a:A,b:Bn,type:an,orb:o,tight:o<2,
          rule:`${A} ${an} ${Bn} — ${ASPECT_QUALITY[an]} ${A} and ${Bn}`+
               (o<2?" (TIGHT orb — strong influence)":"")});
        break;
      }
    }
  }

  // Stelliums (3+ planets in one sidereal sign)
  const bySign={};
  planets.forEach(p=>{const s=signOf(p.sid);(bySign[s]=bySign[s]||[]).push(p.name)});
  const stelliums=Object.entries(bySign).filter(([,a])=>a.length>=3)
                        .map(([s,a])=>({sign:s,planets:a}));

  // Yogas (special combinations)
  const yogas=[];
  const P={}; planets.forEach(p=>{P[p.base]=p});
  // Gaja Kesari: Jupiter in kendra from Moon
  if(P.Jupiter&&P.Moon){
    const d=((P.Jupiter.houseSid-P.Moon.houseSid+12)%12)+1;
    if([1,4,7,10].includes(d)) yogas.push("Gajakesari Yoga — Jupiter in a quadrant from the Moon (wisdom, fortune)");
  }
  // Mahapurusha Yogas (planet in own/exalt sign in kendra from Asc)
  ["Mars","Mercury","Jupiter","Venus","Saturn"].forEach(b=>{
    const p=P[b]; if(!p)return;
    if([1,4,7,10].includes(p.houseSid)&&(p.dignity.startsWith("exalt")||p.dignity.startsWith("in own"))){
      const n={Mars:"Ruchaka",Mercury:"Bhadra",Jupiter:"Hamsa",Venus:"Malavya",Saturn:"Sasha"}[b];
      yogas.push(`${n} Mahapurusha Yoga — ${b} is strong in a quadrant (leadership, mastery)`);
    }
  });

  // Vimshottari Dasha
  const dasha=computeDasha(moon.sid,date);
  const now=new Date();
  const curMaha=dasha.find(m=>m.start<=now&&m.end>=now)||dasha[0];
  const curAntar=curMaha.sub.find(s=>s.start<=now&&s.end>=now);

  // Navamsa D9 summary
  const d9Lagna=navamsaSign(angles.ascSid);
  const d9LagnaIdx=SIGNS.indexOf(d9Lagna);
  const d9SeventhSign=SIGNS[(d9LagnaIdx+6)%12];
  const d9SeventhLord=SIGN_LORD[d9SeventhSign];
  const d9SeventhOcc=planets.filter(p=>p.nav===d9SeventhSign).map(p=>p.base);
  planets.forEach(p=>{p.d9House=((SIGNS.indexOf(p.nav)-d9LagnaIdx+12)%12)+1;});
  const d9asp=[];
  const d9planets=planets.slice(0,10);
  for(let i=0;i<d9planets.length;i++)for(let j=i+1;j<d9planets.length;j++){
    const s1=SIGNS.indexOf(d9planets[i].nav), s2=SIGNS.indexOf(d9planets[j].nav);
    let sep=Math.abs(s1-s2); if(sep>6)sep=12-sep;
    if(sep===0) d9asp.push({a:d9planets[i].base,b:d9planets[j].base,type:"Conjunction"});
    if(sep===6) d9asp.push({a:d9planets[i].base,b:d9planets[j].base,type:"Opposition"});
  }
  // Darakaraka = planet with lowest degree (excluding nodes)
  const dkP=planets.slice(0,7).sort((a,b)=>(a.sid%30)-(b.sid%30))[0];

  // Current Transits (Gochar)
  const tTime=Astronomy.MakeTime(now), tD=tTime.ut, tAy=ayanamsha(tD);
  const tSat=nm(bodyLon(B.Saturn,tTime)-tAy), tJup=nm(bodyLon(B.Jupiter,tTime)-tAy);
  const tRahu=nm(125.04452-0.0529537951*tD-tAy);
  const hFromMoon=s=>( (Math.floor(s/30)-Math.floor(moon.sid/30)+12)%12 )+1;
  const satH=hFromMoon(tSat), jupH=hFromMoon(tJup), rahuH=hFromMoon(tRahu);
  const sSati=satH===12?"first phase (heavy)":satH===1?"peak phase (intense)":satH===2?"final phase (setting)":"";
  
  // Upcoming Eclipses (next ~18 months) — names differ across astronomy-engine builds
  const eclipses=[];
  try{
    const solSearch=Astronomy.SearchGlobalSolarEclipse||Astronomy.SearchSolarEclipse;
    const solNext=Astronomy.NextGlobalSolarEclipse||Astronomy.NextSolarEclipse;
    const collectEcl=(searchFn,nextFn,type,axisOffset)=>{
      if(typeof searchFn!=="function") return;
      let ev=searchFn(Astronomy.MakeTime(now));
      for(let i=0;i<2&&ev&&ev.peak;i++){
        const et=ev.peak;
        const elon=nm(bodyLon(B.Sun,et)-ayanamsha(et.ut)+axisOffset);
        let hit=null;
        planets.forEach(p=>{const d=Math.abs(nm(p.sid)-elon);if(Math.min(d,360-d)<5)hit=p.name;});
        eclipses.push({date:new Date(et.date),type,sign:signOf(elon),house:hFromMoon(elon),hit});
        ev=(typeof nextFn==="function")?nextFn(et):null;
      }
    };
    collectEcl(solSearch,solNext,"Solar Eclipse",0);
    collectEcl(Astronomy.SearchLunarEclipse,Astronomy.NextLunarEclipse,"Lunar Eclipse",180);
    eclipses.sort((a,b)=>a.date-b.date);
  }catch(e){ console.warn("Eclipse computation skipped:",e.message); }

  const chart={planets,angles,nakshatra,aspects,stelliums,yogas,dasha,curMaha,curAntar,ayanamsha:ay,
    d9:{d9Lagna,d9SeventhSign,d9SeventhLord,d9SeventhOcc,darakaraka:dkP?dkP.base:null,aspects:d9asp},
    transits:{asOf:now,saturn:{sign:signOf(tSat),houseMoon:satH,note:satH===10?"Saturn in 10th from Moon — career restructuring":satH===4?"Saturn in 4th from Moon — home focus":""},
      jupiter:{sign:signOf(tJup),houseMoon:jupH,note:[1,2,5,7,9,11].includes(jupH)?"Jupiter in favourable transit":"Jupiter in neutral transit"},
      positions:[{name:"Saturn",sign:signOf(tSat),houseMoon:satH},{name:"Jupiter",sign:signOf(tJup),houseMoon:jupH},{name:"Rahu",sign:signOf(tRahu),houseMoon:rahuH},{name:"Ketu",sign:signOf(tRahu+180),houseMoon:hFromMoon(tRahu+180)}],
      sadeSati:{active:!!sSati,phase:sSati},tnAspects:[]}};
  
  // Transit-to-natal aspects
  const tBodies=[{n:"Saturn",l:tSat},{n:"Jupiter",l:tJup},{n:"Rahu",l:tRahu}];
  tBodies.forEach(tb=>{
    planets.slice(0,10).forEach(np=>{
      let sep=Math.abs(tb.l-np.sid)%360; if(sep>180)sep=360-sep;
      ASPECTS.forEach(([an,ang,orb])=>{if(Math.abs(sep-ang)<3)chart.transits.tnAspects.push({t:tb.n,n:np.name,type:an,orb:Math.abs(sep-ang).toFixed(1)})});
    });
  });

  chart.scores=computeScores(chart);
  chart.houseLords=computeHouseLords(chart);
  chart.predictions=computePredictions(chart);
  chart.confidence=computeConfidence(chart);
  chart.daily=computeDaily(chart,city);
  chart.marriage=computeMarriage(chart);
  return chart;
}

/* ── PREDICTION ENGINE — deterministic timeline windows from dasha + house lords ── */
function phaseLabel(houses,tone){
  if(houses.includes(10)) return "Career Activation";
  if(houses.includes(7)) return "Relationship Karma Phase";
  if(houses.includes(4)) return "Foundation Building";
  if(houses.includes(2)||houses.includes(11)) return "Wealth Expansion Window";
  if(houses.includes(9)||houses.includes(12)) return "Expansion Window";
  if(houses.includes(5)) return "Growth Phase";
  if(tone==="testing") return "Pressure + Opportunity";
  return "Transition Phase";
}
function computePredictions(ch){
  const now=new Date();
  const find=b=>ch.planets.find(p=>p.base===b);
  const rules=b=>ch.houseLords.filter(l=>l.lord===b).map(l=>l.house);
  // flatten all antardasha windows, keep the upcoming/current ones
  const subs=[];
  ch.dasha.forEach(m=>(m.sub||[]).forEach(s=>subs.push({maha:m.lord,...s})));
  return subs.filter(s=>s.end>now).slice(0,5).map(s=>{
    const lp=find(s.lord);
    const ruled=rules(s.lord);
    const houses=[...new Set([...(lp?[lp.houseSid]:[]),...ruled])];
    const dignity=lp?lp.dignity||"":"";
    let tone="mixed";
    if(lp){
      const strong=/exalt|own/.test(dignity);
      const goodHouse=[1,4,5,7,9,10,11].includes(lp.houseSid);
      const hardHouse=[6,8,12].includes(lp.houseSid);
      if(strong||goodHouse) tone="supportive";
      if(/debil/.test(dignity)||(hardHouse&&!strong)) tone="testing";
    }
    const why=[];
    if(lp) why.push(`${s.lord} sits in House ${lp.houseSid} (${signOf(lp.sid)})${dignity?" — "+dignity.split("—")[0].trim():""}`);
    ruled.forEach(h=>why.push(`${s.lord} rules House ${h} [${HOUSE_AREA[h]}]`));
    const themes=houses.map(h=>HOUSE_THEME[h]);
    const summary=(themes.join("; ")+" come into focus.").replace(/^./,c=>c.toUpperCase());
    return {
      period:`${s.maha} – ${s.lord}`,
      start:s.start, end:s.end,
      current: s.start<=now && s.end>=now,
      tone,
      phase: phaseLabel(houses,tone),
      summary,
      areas: houses.map(h=>({house:h,area:HOUSE_AREA[h]})),
      why,
    };
  });
}

/* ── CONFIDENCE ENGINE — counts independent chart signatures per life theme ── */
function computeConfidence(ch){
  const P={}; ch.planets.forEach(p=>{if(!P[p.base])P[p.base]=p;});
  const occ=h=>ch.planets.filter(p=>p.houseSid===h);
  const benefics=["Jupiter","Venus","Mercury","Moon"];
  const wellPlaced=p=>!!p&&(/exalt|own/.test(p.dignity||"")||[1,4,5,7,9,10,11].includes(p.houseSid));
  const lordPlanet=h=>{const hl=ch.houseLords.find(x=>x.house===h);return hl?P[hl.lord]:null;};
  const strong=b=>{const p=P[b];return !!p&&((p.strength||0)>=62||/exalt|own/.test(p.dignity||""));};
  const ruledBy=b=>ch.houseLords.filter(x=>x.lord===b).map(x=>x.house);
  const dashaTouches=h=>{
    const hit=p=>p&&(p.houseSid===h||ruledBy(p.base).includes(h));
    return hit(P[ch.curMaha.lord])||hit(ch.curAntar&&P[ch.curAntar.lord]);
  };
  const build=(theme,checks)=>{
    const yes=checks.filter(c=>c.present).length, ratio=yes/checks.length;
    return {theme, level: ratio>=0.6?"High":ratio>=0.34?"Moderate":"Low",
      count:yes, total:checks.length,
      supporting:checks.filter(c=>c.present).map(c=>c.label),
      missing:checks.filter(c=>!c.present).map(c=>c.label)};
  };
  return [
    build("Career & Status",[
      {label:"Planet(s) occupy the 10th house",present:occ(10).length>0},
      {label:"10th lord strongly placed",present:wellPlaced(lordPlanet(10))},
      {label:"Saturn empowering the career axis",present:!!P.Saturn&&P.Saturn.houseSid===10},
      {label:"A Pancha Mahapurusha yoga",present:ch.yogas.some(y=>/Mahapurusha/.test(y))},
      {label:"Current dasha lord linked to the 10th",present:dashaTouches(10)},
      {label:"Strong career karaka (Sun or Saturn)",present:strong("Sun")||strong("Saturn")},
    ]),
    build("Marriage & Partnership",[
      {label:"7th house occupied",present:occ(7).length>0},
      {label:"7th lord well placed",present:wellPlaced(lordPlanet(7))},
      {label:"Venus well-dignified",present:strong("Venus")},
      {label:"Benefic in the D9 7th house",present:(ch.d9.d9SeventhOcc||[]).some(b=>benefics.includes(b))},
      {label:"Current dasha lord linked to the 7th",present:dashaTouches(7)},
      {label:"Free of Mangal Dosha",present:!(P.Mars&&[1,2,4,7,8,12].includes(P.Mars.houseSid))},
    ]),
    build("Foreign & Relocation",[
      {label:"Planet(s) in the 12th house",present:occ(12).length>0},
      {label:"Jupiter or a benefic in the 12th",present:occ(12).some(p=>benefics.includes(p.base))},
      {label:"Rahu on the 3rd/9th/12th axis",present:!!P.Rahu&&[3,9,12].includes(P.Rahu.houseSid)},
      {label:"Rahu Mahadasha active",present:ch.curMaha.lord==="Rahu"},
      {label:"9th house activated",present:occ(9).length>0},
      {label:"9th or 12th lord well placed",present:wellPlaced(lordPlanet(9))||wellPlaced(lordPlanet(12))},
    ]),
    build("Wealth & Finance",[
      {label:"2nd house occupied",present:occ(2).length>0},
      {label:"11th house occupied",present:occ(11).length>0},
      {label:"Jupiter (wealth karaka) strong",present:strong("Jupiter")},
      {label:"2nd lord well placed",present:wellPlaced(lordPlanet(2))},
      {label:"11th lord well placed",present:wellPlaced(lordPlanet(11))},
      {label:"A Gajakesari or wealth yoga",present:ch.yogas.some(y=>/Gajakesari/.test(y))},
    ]),
  ];
}

/* ── DAILY GUIDANCE ENGINE — weekday lord, numerology, Moon transit, Rahu Kaal ── */
function fmtClock(ms,tz){
  const d=new Date(ms+tz*3600000);
  let h=d.getUTCHours(); const m=d.getUTCMinutes();
  const ap=h>=12?"PM":"AM"; h=h%12||12;
  return h+":"+String(m).padStart(2,"0")+" "+ap;
}
function computeDaily(ch,city){
  const now=new Date();
  const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const WDLORD=["Sun","Moon","Mars","Mercury","Jupiter","Venus","Saturn"];
  const COLOR={Sun:"Orange / Gold",Moon:"White / Cream",Mars:"Red / Coral",
    Mercury:"Green / Emerald",Jupiter:"Yellow / Saffron",Venus:"White / Soft Pink",Saturn:"Deep Blue / Black"};
  const RAHU_SLOT={0:8,1:2,2:7,3:5,4:6,5:4,6:3};        // segment of the day per weekday
  const ALIGN={1:72,2:58,3:82,4:44,5:60,6:78,7:80,8:38,9:62,10:85,11:88,12:42}; // Moon-transit favourability
  const reduce=n=>{while(n>9)n=String(n).split("").reduce((a,b)=>a+ +b,0);return n;};
  const tz=city.tz, wd=now.getDay(), dayLord=WDLORD[wd];
  const luckyNumber=reduce(now.getDate()+now.getMonth()+1+now.getFullYear());

  const t=Astronomy.MakeTime(now);
  const moonLon=nm(bodyLon(Astronomy.Body.Moon,t)-ayanamsha(t.ut));
  const natalMoonIdx=Math.floor(nm(ch.planets[1].sid)/30);
  const moonHouseFromNatal=((Math.floor(moonLon/30)-natalMoonIdx+12)%12)+1;

  // Rahu Kaal & Abhijit Muhurta from real sunrise/sunset at the city
  let rahuKaal=null, auspicious=null;
  try{
    const cityNow=new Date(now.getTime()+tz*3600000);
    const midnightUTC=Date.UTC(cityNow.getUTCFullYear(),cityNow.getUTCMonth(),cityNow.getUTCDate())-tz*3600000;
    const obs=new Astronomy.Observer(city.lat,city.lon,0);
    const start=Astronomy.MakeTime(new Date(midnightUTC));
    const sr=Astronomy.SearchRiseSet(Astronomy.Body.Sun,obs,1,start,1);
    const ss=Astronomy.SearchRiseSet(Astronomy.Body.Sun,obs,-1,start,1);
    if(sr&&ss){
      const sunrise=sr.date.getTime(), sunset=ss.date.getTime();
      const span=sunset-sunrise, seg=span/8, slot=RAHU_SLOT[wd];
      rahuKaal={start:fmtClock(sunrise+(slot-1)*seg,tz),end:fmtClock(sunrise+slot*seg,tz)};
      const mid=sunrise+span/2;
      auspicious={start:fmtClock(mid-span/30,tz),end:fmtClock(mid+span/30,tz)};
    }
  }catch(e){ console.warn("Rahu Kaal skipped:",e.message); }

  return {
    date:now, weekday:WD[wd], dayLord,
    luckyColor:COLOR[dayLord], luckyNumber,
    moonSign:signOf(moonLon), moonHouseFromNatal,
    alignment:ALIGN[moonHouseFromNatal]||60,
    rahuKaal, auspicious,
    dasha:`${ch.curMaha.lord} Mahadasha${ch.curAntar?" / "+ch.curAntar.lord+" Antardasha":""}`,
  };
}

TIMELINE FORECAST (deterministic antardasha windows — word these into predictions; never change the dates or houses):

function KundaliChart({chart,variant}){
  const grahas=chart.planets.filter(p=>PABBR[p.base]);
  const ascSign=Math.floor(nm(chart.angles.ascSid)/30);
  const stk=(arr,cx,cy)=>arr.map((p,j)=>(
    <text key={j} x={cx} y={cy+j*13-(arr.length-1)*6.5} fontSize="11.5"
      fill={p.retro?"#f87171":"#fff"} textAnchor="middle">{PABBR[p.base]}</text>
  ));

  if(variant==="north"){
    const byHouse={};
    grahas.forEach(p=>{(byHouse[p.houseSid]=byHouse[p.houseSid]||[]).push(p)});
    return (
      <svg viewBox="0 0 400 400" style={{width:"100%",maxWidth:330,display:"block",margin:"0 auto"}}>
        <rect x="1" y="1" width="398" height="398" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="2"/>
        <line x1="0" y1="0" x2="400" y2="400" stroke="rgba(255,255,255,0.05)" strokeWidth="1.5"/>
        <line x1="400" y1="0" x2="0" y2="400" stroke="rgba(255,255,255,0.05)" strokeWidth="1.5"/>
        <polygon points="200,0 400,200 200,400 0,200" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1.5"/>
        {NORTH.map((h,i)=>{
          const signNum=((ascSign+i)%12)+1;
          const ps=byHouse[i+1]||[];
          return (
            <g key={i}>
              <text x={h.c[0]} y={h.c[1]-16} fontSize="9" fill="rgba(255,255,255,0.3)" textAnchor="middle">{signNum}</text>
              {stk(ps,h.c[0],h.c[1]+4)}
            </g>
          );
        })}
      </svg>
    );
  }
  const bySign={};
  grahas.forEach(p=>{const s=signOf(p.sid);(bySign[s]=bySign[s]||[]).push(p)});
  const ascS=SIGNS[ascSign];
  return (
    <svg viewBox="0 0 400 400" style={{width:"100%",maxWidth:330,display:"block",margin:"0 auto"}}>
      {Object.entries(SOUTH).map(([sign,[col,row]])=>{
        const x=col*100,y=row*100,ps=bySign[sign]||[],isAsc=sign===ascS;
        return (
          <g key={sign}>
            <rect x={x} y={y} width="100" height="100" fill={isAsc?"rgba(99, 102, 241, 0.1)":"none"} stroke="rgba(255,255,255,0.1)" strokeWidth="1.3"/>
            <text x={x+6} y={y+15} fontSize="9" fill="rgba(255,255,255,0.3)">{sign.slice(0,3)}</text>
            {stk(ps,x+50,y+52)}
          </g>
        );
      })}
    </svg>
  );
}

            <p style={{fontSize:10,color:"#555",textAlign:"center",marginTop:12,letterSpacing:"0.5px"}}>
              Su:Sun • Mo:Moon • Ma:Mars • Me:Mercury • Ju:Jupiter • Ve:Venus • Sa:Saturn • Ra:Rahu • Ke:Ketu
            </p>
          </div>

          {/* Life-area scores */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 16px",color:"#fff"}}>Destiny Matrix</p>
            {chart.scores.map(s=>{
              const col=s.score>=70?"#4ade80":s.score>=45?"#fbbf24":"#f87171";
              return (
                <details key={s.key} style={{marginBottom:14}}>
                  <summary style={{listStyle:"none",cursor:"pointer"}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:6}}>
                      <span style={{color:"#94a3b8"}}>{s.key} <span style={{color:"#555",fontSize:10}}>▸ why</span></span>
                      <span style={{color:col,fontWeight:700}}>{s.score}<span style={{color:"#444",fontWeight:400,marginLeft:2}}>/100</span></span>
                    </div>
                    <div style={{height:6,background:"rgba(255,255,255,0.05)",borderRadius:10,overflow:"hidden"}}>
                      <div style={{width:s.score+"%",height:"100%",background:col,boxShadow:`0 0 10px ${col}44`}}/>
                    </div>
                  </summary>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5,margin:"8px 0 4px"}}>
                    {(s.factors||[]).map((f,i)=>(
                      <span key={i} style={{fontSize:10,color:"#8b9bb0",background:"rgba(255,255,255,0.04)",
                        border:"1px solid rgba(255,255,255,0.07)",borderRadius:5,padding:"2px 7px"}}>{f}</span>
                    ))}
                  </div>
                </details>
              );
            })}
          </div>

          {/* Planet table */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 2px",color:"#fff",display:"flex",alignItems:"center",gap:8}}>
              <span className="astrology-icon" style={{fontSize:18,margin:0}}>🪐</span> Planetary Positions
            </p>
            <p style={{fontSize:10.5,color:"#64748b",margin:"0 0 16px"}}>
              Whole-sign house system — each sign is one full house, so a planet's house does not depend on its degree.
            </p>
            <div className="planet-row" style={{display:"grid",gridTemplateColumns:"1.2fr 1.5fr 1.5fr 0.6fr",fontSize:11,color:"#666",paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,0.1)",textTransform:"uppercase",letterSpacing:"0.5px"}}>
              <span>Planet</span><span>Vedic</span><span>Western</span><span>House</span>
            </div>
            {chart.planets.map((p, i)=>(
              <div key={p.name} className="planet-row" style={{
                display:"grid",gridTemplateColumns:"1.2fr 1.5fr 1.5fr 0.6fr",fontSize:13,padding:"10px 0",
                borderBottom:"1px solid rgba(255,255,255,0.05)",alignItems:"center"
              }}>
                <span style={{color:"#aaa",fontWeight:500}}>{p.name}{p.retro&&<span style={{color:"#f87171",fontSize:11,marginLeft:4}}>℞</span>}</span>
                <span style={{color:"#ddd"}}>{ZE[signOf(p.sid)]} {signOf(p.sid)}</span>
                <span style={{color:"#ddd"}}>{ZE[signOf(p.trop)]} {signOf(p.trop)}</span>
                <span style={{color:"#888",textAlign:"center"}}>{p.houseSid}</span>
              </div>
            ))}
          </div>

          {/* Vimshottari Dasha */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 16px",color:"#fff"}}>Planetary Timing (Dasha)</p>
            <div style={{background:"rgba(99, 102, 241, 0.1)",border:"1px solid rgba(99, 102, 241, 0.2)",borderRadius:12,padding:"16px",marginBottom:16}}>
              <p style={{fontSize:14,color:"#fff",fontWeight:600,margin:0}}>
                {chart.curMaha.lord} Mahadasha
                {chart.curAntar && <span style={{color:"#a855f7"}}> · {chart.curAntar.lord} Antardasha</span>}
              </p>
              <p style={{fontSize:12,color:"#94a3b8",margin:"4px 0 16px"}}>
                {fmtDate(chart.curMaha.start)} – {fmtDate(chart.curMaha.end)}
              </p>
              {(()=>{
                const now=Date.now();
                const bar=(label,s,e,col)=>{
                  const pct=Math.max(0,Math.min(100,Math.round((now-s)/(e-s)*100)));
                  return (
                    <div style={{marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#94a3b8",marginBottom:4}}>
                        <span>{label}</span><span>{pct}% complete</span>
                      </div>
                      <div style={{height:6,background:"rgba(255,255,255,0.05)",borderRadius:10,overflow:"hidden"}}>
                        <div style={{width:pct+"%",height:"100%",background:col,boxShadow:`0 0 10px ${col}44`}}/>
                      </div>
                    </div>
                  );
                };
                return <div>
                  {bar(chart.curMaha.lord, +chart.curMaha.start, +chart.curMaha.end, "#6366f1")}
                  {chart.curAntar && bar(chart.curAntar.lord, +chart.curAntar.start, +chart.curAntar.end, "#a855f7")}
                </div>;
              })()}
            </div>
            {chart.dasha.filter(m=>m.end>new Date()).slice(0,5).map((m,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:m===chart.curMaha?"#fff":"#94a3b8",fontWeight:m===chart.curMaha?600:400}}>{m.lord} Mahadasha</span>
                <span style={{color:"#666",fontSize:12}}>{fmtDate(m.start)} – {fmtDate(m.end)}</span>
              </div>
            ))}
          </div>

          {/* Timeline Forecast */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 4px",color:"#fff"}}>Timeline Forecast</p>
            <p style={{fontSize:11,color:"#64748b",margin:"0 0 16px"}}>Upcoming dasha windows — computed, with the reasoning shown</p>
            {chart.predictions.map((p,i)=>{
              const tc=p.tone==="supportive"?"#4ade80":p.tone==="testing"?"#f87171":"#fbbf24";
              return (
                <div key={i} style={{borderLeft:`2px solid ${tc}`,paddingLeft:12,marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:12.5,fontWeight:600,color:"#e2e8f0"}}>
                      {p.period}{p.current && <span style={{fontSize:9,color:"#4ade80",marginLeft:6,border:"1px solid #4ade80",borderRadius:4,padding:"1px 5px"}}>NOW</span>}
                    </span>
                    <span style={{fontSize:10,color:tc,fontWeight:600,border:`1px solid ${tc}55`,borderRadius:4,padding:"2px 7px"}}>{p.phase}</span>
                  </div>
                  <p style={{fontSize:10.5,color:"#64748b",margin:"2px 0 6px"}}>{fmtDate(p.start)} – {fmtDate(p.end)}</p>
                  <p style={{fontSize:11.5,color:"#cbd5e1",margin:"0 0 7px",lineHeight:1.55}}>{p.summary}</p>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:5}}>
                    {p.areas.map((a,j)=>(
                      <span key={j} style={{fontSize:9.5,color:"#64748b",background:"rgba(255,255,255,0.04)",borderRadius:4,padding:"2px 7px"}}>H{a.house}</span>
                    ))}
                  </div>
                  <details>
                    <summary style={{fontSize:10,color:"#64748b",cursor:"pointer"}}>why this window</summary>
                    {p.why.map((w,j)=>(
                      <p key={j} style={{fontSize:10,color:"#8b9bb0",margin:"3px 0 0"}}>• {w}</p>
                    ))}
                  </details>
                </div>
              );
            })}
          </div>

          {/* Confidence engine */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 4px",color:"#fff"}}>Prediction Confidence</p>
            <p style={{fontSize:11,color:"#64748b",margin:"0 0 16px"}}>How many independent chart signatures back each theme</p>
            {chart.confidence.map((c,i)=>{
              const lc=c.level==="High"?"#4ade80":c.level==="Moderate"?"#fbbf24":"#f87171";
              return (
                <details key={i} style={{marginBottom:12}}>
                  <summary style={{listStyle:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:12.5,color:"#e2e8f0"}}>{c.theme} <span style={{color:"#555",fontSize:10}}>▸</span></span>
                    <span style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:10,color:"#64748b"}}>{c.count}/{c.total}</span>
                      <span style={{fontSize:10,color:lc,fontWeight:700,border:`1px solid ${lc}55`,borderRadius:4,padding:"2px 8px"}}>{c.level}</span>
                    </span>
                  </summary>
                  <div style={{margin:"8px 0 2px"}}>
                    {c.supporting.map((s,j)=>(
                      <p key={j} style={{fontSize:10.5,color:"#86c8a0",margin:"3px 0"}}>✓ {s}</p>
                    ))}
                    {c.missing.map((s,j)=>(
                      <p key={j} style={{fontSize:10.5,color:"#5a6577",margin:"3px 0"}}>○ {s}</p>
                    ))}
                  </div>
                </details>
              );
            })}
          </div>

          {/* Transits */}
          <div className="cosmic-card">
            <p style={{fontSize:14,fontWeight:600,margin:"0 0 16px",color:"#fff"}}>Current Sky (Gochar)</p>
            {chart.transits.sadeSati.active ? (
              <div style={{background:"rgba(239, 68, 68, 0.1)",border:"1px solid rgba(239, 68, 68, 0.2)",borderRadius:12,padding:"12px",marginBottom:16}}>
                <p style={{fontSize:13,color:"#f87171",fontWeight:700,margin:0}}>⚠ Sade Sati Phase: {chart.transits.sadeSati.phase}</p>
                <p style={{fontSize:11,color:"#fca5a5",margin:"4px 0 0"}}>Ends: {chart.transits.sadeSati.end?fmtDay(chart.transits.sadeSati.end):"ongoing"}</p>
              </div>
            ) : (
              <div style={{background:"rgba(34, 197, 94, 0.1)",border:"1px solid rgba(34, 197, 94, 0.2)",borderRadius:12,padding:"12px",marginBottom:16}}>
                <p style={{fontSize:13,color:"#4ade80",fontWeight:600,margin:0}}>✓ Free from Sade Sati</p>
              </div>
            )}
            {chart.transits.positions.map(p=>(
              <div key={p.name} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
                <span style={{color:"#94a3b8"}}>{p.name}</span>
                <span style={{color:"#fff"}}>{ZE[p.sign]} {p.sign} <span style={{color:"#666",fontSize:11,marginLeft:6}}>• {p.houseMoon}th from Moon</span></span>
              </div>
            ))}
          </div>

          {loading && !interp && (
            <div className="cosmic-card" style={{textAlign:"center",padding:"3rem 1.5rem"}}>
              <div className="astrology-icon" style={{fontSize:40,marginBottom:20}}>🔮</div>
              <p style={{color:"#fff",fontSize:16,fontWeight:500,marginBottom:8}}>{loadMsg}</p>
              <p style={{color:"#666",fontSize:12}}>The stars are aligning for you...</p>
            </div>
          )}

          {interp && (
            <div style={{animation:"slideUp 0.8s ease-out"}}>
              <div style={{
                background:"linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%)",
                border:"1px solid rgba(168, 85, 247, 0.3)",
                borderRadius:20,padding:"2rem",marginBottom:24,
                boxShadow: "0 0 30px rgba(168, 85, 247, 0.15)",
                textAlign:"center"
              }}>
                <p style={{fontSize:12,fontWeight:700,color:"#a855f7",margin:"0 0 12px",textTransform:"uppercase",letterSpacing:"3px"}}>Cosmic Blueprint</p>
                <p style={{fontSize:20,fontWeight:600,color:"#fff",margin:0,lineHeight:1.6,fontStyle:"italic"}}>"{interp.lifeTheme}"</p>
              </div>

              <div style={{display:"grid",gap:20}}>
                {[
                  ["Core Identity","✨",interp.bigThree],
                  ["Personality Matrix","👤",interp.personality],
                  ["Destiny & Purpose","💼",interp.career],
                  ["Heart & Soul","💛",interp.relationships]
                ].map(([title,icon,content], idx)=>content&&(
                  <div key={title} className="cosmic-card" style={{margin:0,animationDelay: `${idx * 0.1}s`}}>
                    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                      <span className="astrology-icon" style={{margin:0,fontSize:28}}>{icon}</span>
                      <p style={{fontSize:18,fontWeight:700,margin:0,color:"#fff",letterSpacing:"0.5px"}}>{title}</p>
                    </div>
                    <p style={{fontSize:15,color:"#94a3b8",margin:0,lineHeight:1.8}}>{content}</p>
                  </div>
                ))}
              </div>

              <div className="grid-2" style={{margin:"20px 0"}}>
                <div className="cosmic-card" style={{margin:0,borderColor:"rgba(34, 197, 94, 0.2)",background:"rgba(20, 30, 20, 0.4)"}}>
                  <p style={{fontSize:15,fontWeight:700,color:"#4ade80",marginBottom:16,display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:20}}>✦</span> Celestial Strengths
                  </p>
                  {(interp.strengths||[]).map((s,i)=>(
                    <div key={i} style={{display:"flex",gap:10,marginBottom:10,fontSize:14,color:"#94a3b8",lineHeight:1.5}}>
                      <span style={{color:"#4ade80",fontWeight:700}}>✓</span><span>{s}</span>
                    </div>
                  ))}
                </div>
                <div className="cosmic-card" style={{margin:0,borderColor:"rgba(251, 191, 36, 0.2)",background:"rgba(30, 25, 20, 0.4)"}}>
                  <p style={{fontSize:15,fontWeight:700,color:"#fbbf24",marginBottom:16,display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:20}}>✦</span> Growth Thresholds
                  </p>
                  {(interp.challenges||[]).map((c,i)=>(
                    <div key={i} style={{display:"flex",gap:10,marginBottom:10,fontSize:14,color:"#94a3b8",lineHeight:1.5}}>
                      <span style={{color:"#fbbf24",fontWeight:700}}>↑</span><span>{c}</span>
                    </div>
                  ))}
                </div>
              </div>

              {interp.keyPlacements && (
                <div className="cosmic-card">
                  <p style={{fontSize:16,fontWeight:700,margin:"0 0 16px",color:"#fff"}}>🔑 Key Celestial Placements</p>
                  <div style={{display:"grid",gap:12}}>
                    {interp.keyPlacements.map((k,i)=>(
                      <p key={i} style={{fontSize:14.5,color:"#94a3b8",margin:0,lineHeight:1.7,padding:"12px 16px",background:"rgba(255,255,255,0.03)",borderRadius:12,borderLeft:"4px solid #6366f1"}}>
                        {k}
                      </p>
                    ))}
                  </div>
                </div>
              )}

              {interp.remedies && (
                <div className="cosmic-card" style={{borderColor:"rgba(168, 85, 247, 0.2)",background:"rgba(30, 20, 30, 0.4)"}}>
                  <p style={{fontSize:16,fontWeight:700,color:"#c084fc",margin:"0 0 16px"}}>🪔 Cosmic Guidance & Remedies</p>
                  <div style={{display:"grid",gap:10}}>
                    {interp.remedies.map((r,i)=>(
                      <p key={i} style={{fontSize:14.5,color:"#c084fc",margin:0,lineHeight:1.7,display:"flex",gap:10}}>
                        <span style={{opacity:0.8}}>✨</span> <span>{r}</span>
                      </p>
                    ))}
                  </div>
                </div>
              )}

              {/* Follow-up chat — locked to this chart */}
              <div className="cosmic-card" style={{marginTop:24}}>
                <p style={{fontSize:16,fontWeight:700,color:"#c084fc",margin:"0 0 4px"}}>💬 Ask About Your Kundli</p>
                <p style={{fontSize:12,color:"#64748b",margin:"0 0 16px"}}>
                  Ask anything about your future, career, marriage or timing — answered from your chart only.
                </p>

                {chatMsgs.length===0 && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
                    {["When will I marry?","How is my career future?","What does my current dasha mean?","Will I settle abroad?"].map(q=>(
                      <button key={q} onClick={()=>setChatInput(q)} style={{
                        fontSize:12,padding:"6px 12px",borderRadius:16,cursor:"pointer",color:"#a5b4fc",
                        border:"1px solid rgba(168,85,247,0.3)",background:"rgba(168,85,247,0.08)"}}>{q}</button>
                    ))}
                  </div>
                )}

                <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
                  {chatMsgs.map((m,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                      <div style={{maxWidth:"85%",fontSize:13.5,lineHeight:1.65,padding:"10px 14px",borderRadius:14,whiteSpace:"pre-wrap",
                        background:m.role==="user"?"rgba(99,102,241,0.18)":"rgba(255,255,255,0.04)",
                        border:"1px solid "+(m.role==="user"?"rgba(99,102,241,0.4)":"rgba(255,255,255,0.08)"),
                        color:m.role==="user"?"#e0e7ff":"#cbd5e1"}}>
                        {m.content}
                      </div>
                    </div>
                  ))}
                </div>

                <form onSubmit={askChat} style={{display:"flex",gap:8}}>
                  <input className="premium-input" style={{flex:1}} placeholder="Ask about your future…"
                    value={chatInput} onChange={e=>setChatInput(e.target.value)} disabled={chatBusy} />
                  <button type="submit" disabled={chatBusy||!chatInput.trim()} style={{
                    padding:"10px 20px",borderRadius:10,fontSize:13,fontWeight:600,cursor:chatBusy?"not-allowed":"pointer",
                    border:"1px solid rgba(168,85,247,0.4)",background:"rgba(168,85,247,0.15)",color:"#c084fc",
                    opacity:chatBusy?0.5:1}}>
                    {chatBusy?"…":"Send"}
                  </button>
                </form>
              </div>

              <p style={{fontSize:11,color:"#444",textAlign:"center",marginTop:40,lineHeight:1.8,maxWidth:500,margin:"40px auto 0",letterSpacing:"0.5px"}}>
                Disclaimer: Astrology is a tool for self-reflection and spiritual insight.
                Celestial cycles reflect possibilities, not certainties. Always use your own judgment.
              </p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
