name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main

# Cancel-in-progress is OFF: a deploy must finish (flip + health-check + maybe
# rollback) atomically; killing it mid-flip could leave a dangling symlink.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Gate: build IMMUTABLE artifacts + test BEFORE we touch the server ────────
  # Nothing is built on the production host anymore. This job produces two
  # tarballs/dirs (backend release + frontend dist); the deploy job only ships
  # and activates them. If anything here fails, prod is left untouched.
  #
  # NOTE on `npm install` vs `npm ci`: the lockfile is currently authored on a
  # newer npm than CI's Node 20 runs, so `npm ci` rejects optional deps. We pin
  # Node via .nvmrc (20.11.0) — once the lock is regenerated on Node 20, switch
  # every `npm install` below to `npm ci` for byte-for-byte reproducibility.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Full install (incl. devDeps) so vitest/sqlite can run the test gate.
      - name: Backend — install + test
        working-directory: backend
        run: |
          npm install
          npm test         # vitest on sqlite (NODE_ENV=test) — no DB needed
        env:
          NODE_ENV: test

      # Build the IMMUTABLE backend release: a clean prod-only node_modules (no
      # devDeps, and — verified — ZERO native .node binaries, so the x64-CI build
      # is portable to an ARM64 or x64 VPS) tarred together with src/. This is
      # what runs in production; the host never runs npm install again.
      - name: Backend — build release artifact
        working-directory: backend
        run: |
          rm -rf node_modules
          npm install --omit=dev
          tar -czf ../backend-release.tar.gz \
            package.json package-lock.json node_modules src

      - name: Upload backend release
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: backend-release.tar.gz
          retention-days: 3

      # Frontend env is NOT injected here anymore — Vite auto-loads the committed
      # frontend/.env.production at build time. VITE_* values are baked into the
      # public bundle (not secret), so they live in that file, not a GH secret.
      - name: Frontend — install + build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ── Deploy: only runs if `verify` passed ─────────────────────────────────────
  # Capistrano-style atomic release:
  #   DEPLOY_PATH/                  (release root — NOT a git clone anymore)
  #     releases/<sha>/             unpacked immutable artifact
  #     shared/.env                 the real prod env (lives outside releases)
  #     shared/logs/                pm2 logs (survive releases)
  #     current -> releases/<sha>   atomically flipped symlink
  # pm2 is started THROUGH the `current` symlink, so a plain `pm2 reload` after
  # the flip re-execs the new release; rollback just flips the symlink back.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download backend release
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: .

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Ship the immutable artifacts to a staging spot on the box.
      - name: Upload backend artifact to server
        uses: appleboy/scp-action@v0.1.7   # TODO: pin to a commit SHA
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: backend-release.tar.gz
          target: /tmp/astro-deploy

      - name: Upload frontend dist to server
        uses: appleboy/scp-action@v0.1.7   # TODO: pin to a commit SHA
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*"
          target: /tmp/astro-deploy/frontend-dist
          strip_components: 2

      # Activate the backend (atomic flip + health-check + rollback), THEN the
      # frontend — so a failed backend never ships a mismatched frontend.
      - name: Activate release (atomic, with health check + rollback)
        uses: appleboy/ssh-action@v1.0.3   # TODO: pin to a commit SHA
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            APP="${{ secrets.DEPLOY_PATH }}"     # release root (e.g. /home/ubuntu/app)
            SHA="${{ github.sha }}"
            REL="$APP/releases/$SHA"
            PORT="${{ secrets.BACKEND_PORT }}"

            mkdir -p "$APP/releases" "$APP/shared/logs"

            # The real prod env lives OUTSIDE releases and is required.
            if [ ! -f "$APP/shared/.env" ]; then
              echo "::error::Missing $APP/shared/.env — create it once before deploying."
              exit 1
            fi

            # 1. Unpack the immutable artifact into a fresh release dir.
            rm -rf "$REL"; mkdir -p "$REL"
            tar -xzf /tmp/astro-deploy/backend-release.tar.gz -C "$REL"

            # 2. Wire shared mutable state into the release (dotenv reads ./.env
            #    from the process CWD, which we set to `current` below).
            ln -sfn "$APP/shared/.env" "$REL/.env"

            # 3. Remember the live target for rollback (empty on first deploy).
            PREV=""
            if [ -L "$APP/current" ]; then PREV="$(readlink "$APP/current")"; fi

            # 4. ATOMIC activation — ln -sfn swaps the symlink in a single syscall.
            ln -sfn "$REL" "$APP/current"

            # (Migrations would run here, after the flip, once baseline exists:
            #  cd "$APP/current" && npm run migrate || rollback)

            # 5. Graceful reload through the symlink, or first-time start. We pass
            #    the symlink path so pm2 stores it literally and future reloads
            #    re-exec whatever `current` points at.
            if pm2 describe astrology-backend >/dev/null 2>&1; then
              pm2 reload astrology-backend --update-env
            else
              pm2 start "$APP/current/src/server.js" \
                --name astrology-backend \
                --cwd "$APP/current" \
                --output "$APP/shared/logs/out.log" \
                --error  "$APP/shared/logs/err.log" \
                --update-env
            fi
            pm2 save

            # 6. Health-check the new release; flip back on failure.
            ok=0
            for i in $(seq 1 10); do
              sleep 3
              if curl -fsS "http://127.0.0.1:$PORT/health" >/dev/null; then ok=1; break; fi
              echo "health attempt $i failed, retrying…"
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::Health check failed — rolling back."
              if [ -n "$PREV" ]; then
                ln -sfn "$PREV" "$APP/current"
                pm2 reload astrology-backend --update-env || pm2 restart astrology-backend
                pm2 save
                echo "Rolled back to $PREV"
              else
                echo "No previous release to roll back to (first deploy)."
              fi
              exit 1
            fi
            echo "Backend healthy on $SHA."

            # 7. Frontend: swap atomically-enough via rsync --delete into the web
            #    root nginx serves. (Backend is already verified healthy.)
            rsync -a --delete /tmp/astro-deploy/frontend-dist/ "${{ secrets.FRONTEND_DEPLOY_PATH }}/"
            echo "Frontend published."

            # 8. Keep the last 5 releases; prune the rest (active + rollback are
            #    always the two newest, so they're never pruned).
            ls -1dt "$APP"/releases/*/ | tail -n +6 | xargs -r rm -rf
            rm -rf /tmp/astro-deploy
            echo "Deploy complete: $SHA"
