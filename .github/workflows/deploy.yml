name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main  # or master, change if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            cd backend
            npm install --production
            pm2 restart astrology-backend || pm2 start src/server.js --name astrology-backend
            pm2 save
      - name: Build and Deploy Frontend
        run: |
          cd frontend
          npm install
          npm run build
        
      - name: Copy Frontend Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "frontend/dist/*"
          target: "${{ secrets.FRONTEND_DEPLOY_PATH }}"
          strip_components: 2
