name: Scheduled Notifications

on:
  schedule:
    # Morning: 08:30 IST (03:00 UTC)
    - cron: '0 3 * * *'
    # Re-engage: 10:00 IST (04:30 UTC)
    - cron: '30 4 * * *'
    # Evening: 16:45 IST (11:15 UTC)
    - cron: '15 11 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Job Type
        id: job_type
        run: |
          HOUR=$(date +%H)
          if [ "$HOUR" == "03" ]; then
            echo "job=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" == "04" ]; then
            echo "job=reengage" >> $GITHUB_OUTPUT
          elif [ "$HOUR" == "11" ]; then
            echo "job=evening" >> $GITHUB_OUTPUT
          else
            echo "job=morning" >> $GITHUB_OUTPUT # Default for manual trigger
          fi

      - name: Trigger Notification
        run: |
          curl -X POST "https://astrology-ai-pro-ez9t.vercel.app/api/cron/run?job=${{ steps.job_type.outputs.job }}" \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          -v
